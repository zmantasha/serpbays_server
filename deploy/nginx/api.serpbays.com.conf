# =============================================================================
# api.serpbays.com — clean public hostname for the external partner API.
# Proxies ONLY /api/ routes to Strapi (localhost:1338). Everything else 404s,
# so the Strapi admin panel is NOT exposed under this name (admin stays on
# prod-cms.serpbays.com). HTTPS block is added by Certbot after DNS resolves.
# =============================================================================
server {
    server_name api.serpbays.com;

    client_max_body_size    2M;
    client_body_timeout     60s;

    # All backend functionality lives under Strapi's /api prefix.
    location /api/ {
        proxy_pass http://localhost:1338;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # Nothing else is served on this hostname (no admin panel, no root).
    # (Certbot --nginx manages the ACME HTTP-01 challenge automatically.)
    location / {
        return 404;
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/api.serpbays.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/api.serpbays.com/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}

server {
    if ($host = api.serpbays.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    server_name api.serpbays.com;
    return 404; # managed by Certbot


}