# =============================================================================
# prod-cms.serpbays.com — nginx vhost (AUDIT COPY, for reference only)
# =============================================================================
# Source of truth lives at:
#   /etc/nginx/sites-available/prod-cms.serpbays.conf
# on the production host. This file is tracked in git as a tracked audit copy
# so changes to the live nginx config are reviewable alongside backend code.
#
# Deploy procedure (run on the prod host, after merging changes here):
#   sudo cp /var/www/serpbays-app-server/deploy/nginx/prod-cms.serpbays.conf \
#           /etc/nginx/sites-available/prod-cms.serpbays.conf
#   sudo nginx -t            # MUST pass before reload
#   sudo nginx -s reload     # zero-downtime reload
#
# Body-size policy (matches Strapi strapi::body limits in config/middlewares.js):
#   * Default vhost cap:                2M  (blocks runaway abuse on misc routes)
#   * /api/orders|projects|order-contents: 10M  (rich-text order content)
#   * /api/api/cart:                    10M  (Strapi global prefix + /api/cart)
#   * /api/upload:                      50M  (streamed, media uploads)
# =============================================================================
server {
    server_name prod-cms.serpbays.com;

    # Conservative default for the whole vhost
    client_max_body_size      2M;
    client_body_timeout       60s;
    client_body_buffer_size   256k;

    # Order / cart / project endpoints — allow rich-text article content
    # Matches /api/orders, /api/projects, /api/order-contents
    location ~ ^/api/(orders|projects|order-contents)(/|$) {
        client_max_body_size 10M;
        proxy_pass http://localhost:1338;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # Cart endpoint — Strapi global /api prefix + route /api/cart => /api/api/cart
    # ^~ prefix beats the regex location above
    location ^~ /api/api/cart {
        client_max_body_size 10M;
        proxy_pass http://localhost:1338;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # Strapi media uploads — bigger, streamed directly to upstream
    location /api/upload {
        client_max_body_size 50M;
        proxy_request_buffering off;
        proxy_pass http://localhost:1338;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    location / {
        proxy_pass http://localhost:1338;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/prod-cms.serpbays.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/prod-cms.serpbays.com/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

server {
    if ($host = prod-cms.serpbays.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    listen 80;
    server_name prod-cms.serpbays.com;
    return 404; # managed by Certbot
}
